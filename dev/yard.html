<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yard renderer — dev</title>
  <style>
    :root { --slate-900: #26313C; --slate-700: #3E4A59; --paper: #ECE6DA; --marigold: #E8B04A; --teal: #49A3A0; }
    html, body { margin: 0; height: 100%; background: var(--slate-900); color: var(--paper); font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
    #yard { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { background: var(--slate-700); color: var(--paper); border: 0; border-radius: 999px; padding: 8px 12px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--marigold); color: var(--slate-900); }
    #hud { position: fixed; top: 10px; left: 12px; font-variant-numeric: tabular-nums; opacity: 0.8; }
    #split { width: 140px; accent-color: var(--marigold); }
  </style>
</head>
<body>
  <canvas id="yard"></canvas>
  <div id="hud">…</div>
  <div id="ui">
    <span id="poses"></span>
    <button id="rain" aria-pressed="true">rain</button>
    <button id="splitBtn" aria-pressed="false">split</button>
    <input id="split" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="split position">
  </div>
  <script type="module" src="./yard.js"></script>
</body>
</html>
